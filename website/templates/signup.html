<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
    <style>
        body{
            margin:0;
            padding:0;
            height:100vh;
            background: linear-gradient(to right, #43cea2, #185a9d);
            font-family: Arial, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .signup-box{
            background:#fff;
            padding:40px;
            width:350px;
            border-radius:12px;
            box-shadow:0px 10px 25px rgba(0,0,0,0.2);
            text-align:center;
        }
        h2{
            margin-bottom:20px;
            color:#333;
        }
        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border-radius:6px;
            border:1px solid #ccc;
            font-size:16px;
        }
        button{
            width:100%;
            padding:12px;
            background:#43cea2;
            border:none;
            color:white;
            font-size:16px;
            border-radius:6px;
            cursor:pointer;
            margin-top:15px;
        }
        button:hover{
            background:#36b391;
        }
        .link{
            margin-top:15px;
        }
        .link a{
            text-decoration:none;
            color:#185a9d;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="signup-box">
    <h2>Create Account</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button>Sign Up</button>
    </form>

    <div class="link">
        Already have an account? <a href="/">Login</a>
    </div>
</div>

</body>
</html>
