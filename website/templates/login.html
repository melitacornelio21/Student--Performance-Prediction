<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body{
            margin:0;
            padding:0;
            height:100vh;
            background: linear-gradient(to right, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .login-box{
            background:#fff;
            padding:40px;
            width:350px;
            border-radius:12px;
            box-shadow:0px 10px 25px rgba(0,0,0,0.2);
            text-align:center;
        }
        h2{
            margin-bottom:20px;
            color:#333;
        }
        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border-radius:6px;
            border:1px solid #ccc;
            font-size:16px;
        }
        button{
            width:100%;
            padding:12px;
            background:#667eea;
            border:none;
            color:white;
            font-size:16px;
            border-radius:6px;
            cursor:pointer;
            margin-top:15px;
        }
        button:hover{
            background:#5563c1;
        }
        .link{
            margin-top:15px;
        }
        .link a{
            text-decoration:none;
            color:#667eea;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Student Login</h2>
    <form method="POST" action="/login">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button>Login</button>
    </form>

    <div class="link">
        New user? <a href="/signup">Create account</a>
    </div>
</div>

</body>
</html>
